[package]
name = "bridge-platform"
description = "OS integration traits with per-OS implementations and mocks."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
mock = []

[dependencies]
bridge-core.workspace = true
bridge-protocol.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
png = "0.18.1"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Globalization", "Win32_UI_TextServices", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Media", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
windows ={ version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"
midir = "0.11.1"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFCGTypes", "CFDictionary", "CFMachPort", "CFRunLoop", "CFString", "CFNumber"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "objc2", "libc", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["xinput", "xtest", "randr", "xfixes"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "input_capture", "remote_desktop", "screencast"] }
reis = { version = "0.7.1", features = ["tokio"] }
futures-util = { version = "0.3.34", default-features = false }
rustix = { version = "1.1.5", features = ["time"] }
tokio = { workspace = true, features = ["rt", "net", "time", "macros"] }
tracing.workspace = true
libc = "0.2"
