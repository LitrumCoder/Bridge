[package]
name = "bridge-platform"
description = "OS integration traits with per-OS implementations and mocks."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
mock = []

[dependencies]
bridge-core.workspace = true
bridge-protocol.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Globalization", "Win32_UI_TextServices"] }

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["xinput", "xtest", "randr"] }
