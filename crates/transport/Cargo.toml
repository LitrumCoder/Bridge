[package]
name = "bridge-transport"
description = "Transport trait and QUIC implementation."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bridge-core.workspace = true
bridge-protocol.workspace = true
bytes.workspace = true
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls", "ring", "log"] }
quinn-proto = { version = "0.11.19", default-features = false }
rcgen ={ version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
