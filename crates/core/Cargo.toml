[package]
name = "bridge-core"
description = "Sans-IO core: peers, sessions, routing, cursor state, layout geometry, channel scheduling."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bridge-protocol.workspace = true
hmac = "0.12.1"
rand_core = { version = "0.6.4", default-features = false }
serde.workspace = true
sha2 = { version = "0.10.9", default-features = false }
# No `getrandom`: randomness comes from the driver, the core never calls the OS.
spake2 = { version = "0.4.0", default-features = false }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
