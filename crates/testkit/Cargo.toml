[package]
name = "bridge-testkit"
description = "Test harness: virtual UDP network, in-process multi-node setups."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bridge-core.workspace = true
bridge-daemon.workspace = true
bridge-feature-input.workspace = true
bridge-feature-midi.workspace = true
bridge-platform = { workspace = true, features = ["mock"] }
bridge-protocol.workspace = true
bridge-transport.workspace = true
tokio = { workspace = true, features = ["time", "rt-multi-thread"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Media"] }

[dev-dependencies]
bridge-discovery.workspace = true
bridge-feature-clipboard.workspace = true
bridge-feature-files.workspace = true
bytes.workspace = true
criterion.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["time", "rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[bench]]
name = "input_latency"
harness = false

[[bench]]
name = "midi_latency"
harness = false

[lints]
workspace = true
