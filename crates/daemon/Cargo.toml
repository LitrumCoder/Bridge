[package]
name = "bridge-daemon"
description = "Node assembly (`bridge_node`) and the `bridged` daemon."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "bridge_daemon"

[[bin]]
name = "bridged"
path = "src/main.rs"

[dependencies]
bridge-protocol.workspace = true
bridge-core.workspace = true
bridge-transport.workspace = true
bridge-discovery.workspace = true
bridge-platform.workspace = true
bridge-feature-input.workspace = true
bridge-feature-clipboard.workspace = true
bridge-feature-files.workspace = true
bridge-feature-midi.workspace = true
bridge-ipc.workspace = true
bytes.workspace = true
clap.workspace = true
directories = "6.0.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ring = "0.17.14"
serde = { workspace = true, features = ["derive"] }
toml = "1.1.8"

[lints]
workspace = true
