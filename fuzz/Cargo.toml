[package]
name = "bridge-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
bridge-protocol = { path = "../crates/protocol" }

# Separate workspace: built with nightly, never shipped (ADR-0013, ADR-0014).
[workspace]
members = ["."]

[[bin]]
name = "frame_envelope"
path = "fuzz_targets/frame_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_payload"
path = "fuzz_targets/control_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datagram"
path = "fuzz_targets/datagram.rs"
test = false
doc = false
bench = false
