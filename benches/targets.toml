# Benchmark targets (ADR-0014). `cargo xtask bench-check` compares criterion estimates with
# `max_ns * ci_factor`; `--strict` uses the exact limits on the reference machine.
# Targets are added together with their benchmarks (milestones 1, 4a, 6a, 7).
ci_factor = 2.0

# Full control-stream path: encode message, envelope, frame, then decode all three.
# Reference: 195 ns median on the development machine (2026-10-26).
[[bench]]
id = "codec/clock_pong_roundtrip"
statistic = "median"
max_ns = 400

# Key press: OS hook on A → router → QUIC over 127.0.0.1 → core → injector on B.
# Target from ADR-0014: p50 < 0.5 ms. Reference: 94 µs median (2026-10-26).
[[bench]]
id = "input/key_capture_to_injection_loopback"
statistic = "median"
max_ns = 500000

# Note on A's instrument → B's virtual source, over 127.0.0.1, with the default 3 ms
# jitter buffer. ADR-0009: under 5 ms added. Reference: 3.18 ms median (2026-10-27).
[[bench]]
id = "midi/note_instrument_to_daw_loopback"
statistic = "median"
max_ns = 5000000
