name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  check:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bash .github/scripts/annotate.sh cargo test --workspace --locked
        shell: bash
      - run: cargo xtask check-deps

  platform-x11:
    name: X11 capture and injection (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: xvfb-run -a env BRIDGE_X11_TESTS=1 cargo test --locked -p bridge-platform --features mock --test x11_native -- --test-threads=1 --nocapture

  platform-windows:
    name: Windows hooks and SendInput
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked -p bridge-platform --features mock --test windows_native -- --test-threads=1 --nocapture
        env:
          BRIDGE_PLATFORM_TESTS: "1"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny
      - run: bash .github/scripts/annotate.sh cargo deny --locked check advisories bans licenses sources
      - run: bash .github/scripts/annotate.sh cargo deny --locked --manifest-path fuzz/Cargo.toml check licenses
      - run: bash .github/scripts/annotate.sh cargo deny --locked --manifest-path apps/desktop/src-tauri/Cargo.toml check licenses

  coverage:
    name: coverage (protocol, core >= 85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: >
          cargo llvm-cov --locked -p bridge-protocol -p bridge-core
          --ignore-filename-regex 'strategy\.rs'
          --fail-under-lines 85 --summary-only

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-fuzz@0.13.2
      - name: run targets
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            bash ../.github/scripts/annotate.sh cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=1024
          done

  bench:
    name: benchmarks vs targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: bash .github/scripts/annotate.sh cargo bench --locked -p bridge-protocol -p bridge-testkit -- --noplot
      - run: bash .github/scripts/annotate.sh cargo xtask bench-check
