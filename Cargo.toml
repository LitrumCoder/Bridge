[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/core",
    "crates/transport",
    "crates/discovery",
    "crates/platform",
    "crates/features/input",
    "crates/features/clipboard",
    "crates/features/files",
    "crates/features/midi",
    "crates/ipc",
    "crates/daemon",
    "crates/cli",
    "crates/ffi",
    "crates/testkit",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/OWNER/bridge"

[workspace.dependencies]
bridge-protocol = { path = "crates/protocol" }
bridge-core = { path = "crates/core" }
bridge-transport = { path = "crates/transport" }
bridge-discovery = { path = "crates/discovery" }
bridge-platform = { path = "crates/platform" }
bridge-feature-input = { path = "crates/features/input" }
bridge-feature-clipboard = { path = "crates/features/clipboard" }
bridge-feature-files = { path = "crates/features/files" }
bridge-feature-midi = { path = "crates/features/midi" }
bridge-ipc = { path = "crates/ipc" }
bridge-daemon = { path = "crates/daemon" }

postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
proptest = "1.12.0"
criterion = "0.8.2"
tokio = "1.54.1"
bytes = "1.12.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
bridge-testkit = { path = "crates/testkit" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
